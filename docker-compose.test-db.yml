# Inicia um PostgreSQL descartável somente para os testes locais do backend.
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vers_test
      POSTGRES_PASSWORD: vers_test_local_only
      POSTGRES_DB: vers_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vers_test -d vers_test"]
      interval: 2s
      timeout: 2s
      retries: 20
