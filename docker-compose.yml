# docker-compose.yml — Infraestrutura do VERS
#
# Define os serviços de infraestrutura (PostgreSQL, Redis) e as aplicações
# (backend, web, dashboard, mobile, ai-service) para desenvolvimento local.
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: vers-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vers123}
      POSTGRES_DB: ${POSTGRES_DB:-vers}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vers} -d ${POSTGRES_DB:-vers}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vers-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vers-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vers}:${POSTGRES_PASSWORD:-vers123}@postgres:5432/${POSTGRES_DB:-vers}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Monta o diretório services/backend/src para hot-reload em dev
      - ./services/backend/src:/app/services/backend/src

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vers-web
    restart: unless-stopped
    ports:
      - "3001:5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./services/web/src:/app/services/web/src

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: vers-dashboard
    restart: unless-stopped
    ports:
      - "3050:5174"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./services/dashboard/src:/app/services/dashboard/src

  mobile:
    build:
      context: .
      dockerfile: docker/Dockerfile.mobile
    container_name: vers-mobile
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST:-localhost}
    volumes:
      - ./services/mobile:/app/services/mobile

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: vers-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vers}:${POSTGRES_PASSWORD:-vers123}@postgres:5432/${POSTGRES_DB:-vers}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
