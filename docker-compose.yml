# docker-compose.yml — Infraestrutura do VERS
#
# Define os serviços de apoio (Redis) e as aplicações
# (backend, web, mobile, ai-service) para desenvolvimento local.
# O dashboard Electron roda no host: pnpm --filter @vers/dashboard dev.
# Banco: Neon (nuvem) — sem PostgreSQL local.
# Uso: docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: vers-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vers-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Monta o diretório services/backend/src para hot-reload em dev
      - ./services/backend/src:/app/services/backend/src

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vers-web
    restart: unless-stopped
    ports:
      - "3001:5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./services/web/src:/app/services/web/src

  mobile:
    extends:
      file: docker-compose.mobile.yml
      service: mobile

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: vers-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VIBER_BUDGET_PATH: /var/lib/vers-viber/budget.json
    volumes:
      - viberorcamento:/var/lib/vers-viber

volumes:
  redisdata:
  viberorcamento:
