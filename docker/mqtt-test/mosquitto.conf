# Broker exclusivo do ensaio local; credenciais/certificado gerados em volumes dedicados.
listener 8883
allow_anonymous false
password_file /auth/passwords
acl_file /mosquitto/config/acl
certfile /tls/server.crt
keyfile /tls/server.key
tls_version tlsv1.2
max_packet_size 66048
message_size_limit 65536
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
log_dest stdout
log_type error
log_type warning
