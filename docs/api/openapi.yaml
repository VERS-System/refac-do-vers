# Especificação OpenAPI dos contratos iniciais da API REST do VERS.
openapi: 3.1.0
info:
  title: VERS API
  version: 0.1.0
  description: >-
    Contratos iniciais de autenticação, perfil e veículos. Tokens JWT trafegam
    somente em cookies HttpOnly e nunca são retornados no JSON.
servers:
  - url: https://api.example.vers/api/v1
    description: Exemplo de produção; domínio definitivo pendente.
tags:
  - name: Auth
  - name: Users
  - name: Vehicles
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Cadastra usuário e inicia sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica usuário e inicia sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona a sessão usando somente o refresh cookie
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Cookies rotacionados; nenhum token é retornado no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthenticationCookies'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga a sessão atual e limpa os cookies
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Sessão revogada e cookies expirados.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthenticationCookies'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoga todas as sessões do usuário
      security:
        - accessCookie: []
      responses:
        '204':
          description: Sessões revogadas e cookies atuais expirados.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthenticationCookies'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /users/me:
    get:
      tags: [Users]
      summary: Retorna o perfil autenticado
      security:
        - accessCookie: []
      responses:
        '200':
          description: Perfil encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Users]
      summary: Atualiza o perfil autenticado
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /vehicles:
    get:
      tags: [Vehicles]
      summary: Lista veículos vinculados ao usuário
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Vehicles]
      summary: Cadastra veículo e cria vínculo OWNER
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Veículo cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [Vehicles]
      summary: Consulta veículo autorizado
      security:
        - accessCookie: []
      responses:
        '200':
          description: Veículo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Vehicles]
      summary: Atualiza veículo ou o torna principal
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
      responses:
        '200':
          description: Veículo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Vehicles]
      summary: Exclui veículo preservando um principal quando necessário
      description: >-
        O último veículo não pode ser excluído. replacementVehicleId é exigido
        ao excluir o principal quando houver dois ou mais candidatos restantes.
        Com um único candidato restante, a promoção é automática.
      security:
        - accessCookie: []
      parameters:
        - name: replacementVehicleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Veículo excluído e substituto promovido quando aplicável.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: vers_access_token
      description: JWT em cookie HttpOnly; Secure em produção.
    refreshCookie:
      type: apiKey
      in: cookie
      name: vers_refresh_token
      description: JWT rotativo em cookie HttpOnly; Secure em produção.
  headers:
    AuthenticationCookies:
      description: >-
        Cookies HttpOnly de autenticação emitidos, rotacionados ou expirados.
        Nenhum token é exposto ao JavaScript.
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Authenticated:
      description: Sessão iniciada; tokens disponíveis somente nos cookies.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/AuthenticationCookies'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponseEnvelope'
    ValidationError:
      description: Entrada ou regra de negócio inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnauthorizedError:
      description: Sessão ausente, inválida, expirada ou revogada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ConflictError:
      description: Email ou placa já cadastrados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFoundError:
      description: Recurso inexistente ou não acessível ao usuário.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: '^(?=.*[A-Z])(?=.*[^A-Za-z0-9])[^\s]+$'
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: [string, 'null']
          maxLength: 120
        avatarUrl:
          type: [string, 'null']
          format: uri
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required: [licensePlate]
      properties:
        licensePlate:
          type: string
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$'
          description: Placa brasileira normalizada, imutável após cadastro.
        brand:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 120
        modelYear:
          type: integer
          minimum: 1886
          maximum: 2100
    UpdateVehicleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        brand:
          type: [string, 'null']
          maxLength: 80
        model:
          type: [string, 'null']
          maxLength: 120
        modelYear:
          type: [integer, 'null']
          minimum: 1886
          maximum: 2100
        isPrimary:
          type: boolean
          description: Somente true promove o veículo; false não remove o único principal.
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - avatarUrl
        - roles
        - status
        - emailVerifiedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          items:
            type: string
            enum: [USER, ADMIN, TECHNICIAN]
        status:
          type: string
          enum: [ACTIVE, BLOCKED, PENDING_VERIFICATION]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Vehicle:
      type: object
      additionalProperties: false
      required:
        - id
        - licensePlate
        - brand
        - model
        - modelYear
        - relationship
        - isPrimary
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        licensePlate:
          type: string
        brand:
          type: [string, 'null']
        model:
          type: [string, 'null']
        modelYear:
          type: [integer, 'null']
        relationship:
          type: string
          enum: [OWNER, DRIVER, ADMIN]
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    ApiErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ApiErrorResponse:
      type: object
      required: [error, requestId, timestamp]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - AUTH_EMAIL_ALREADY_REGISTERED
                - AUTH_INVALID_CREDENTIALS
                - AUTH_INVALID_REFRESH_TOKEN
                - AUTH_SESSION_REVOKED
                - AUTH_UNAUTHORIZED
                - USER_NOT_FOUND
                - VALIDATION_ERROR
                - VEHICLE_LICENSE_PLATE_ALREADY_REGISTERED
                - VEHICLE_NOT_FOUND
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ApiErrorDetail'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    AuthResponseEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'
        requestId:
          type: string
    UserProfileResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/UserProfile'
        requestId:
          type: string
    VehicleResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
        requestId:
          type: string
    VehicleListResponse:
      type: object
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          type: string
