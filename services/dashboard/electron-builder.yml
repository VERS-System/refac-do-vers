# electron-builder.yml — Configuração de build do Electron
#
# Define os alvos de empacotamento para Windows, macOS e Linux.
# Usado por: pnpm build:electron

appId: br.edu.ucb.vers
productName: VERS Dashboard
copyright: Copyright © 2026

directories:
  output: ../../output/desktop-delivery
  buildResources: build

# O electron-vite gera main, preload e renderer em out/.
files:
  - out/**/*
  - package.json

# As dependências de execução são JavaScript; não recompilar módulos nativos opcionais.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  # Demonstração local sem assinatura; usa o ícone padrão até existir asset próprio.
  signAndEditExecutable: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  target:
    - target: AppImage
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
